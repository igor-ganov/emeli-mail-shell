[package]
name = "emeli"
version = "0.1.0"
edition = "2021"
description = "Emeli-mail desktop shell"
authors = ["igor-ganov"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
imap = "2.4"
native-tls = "0.2"

[profile.release]
opt-level = "s"
lto = true

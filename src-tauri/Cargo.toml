[package]
name = "emeli"
version = "0.1.0"
edition = "2021"
description = "Emeli-mail desktop shell"
authors = ["igor-ganov"]
license = "MIT"

[lib]
name = "emeli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
imap = { version = "2.4", default-features = false }
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
mail-parser = "0.9"
rfc2047-decoder = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
